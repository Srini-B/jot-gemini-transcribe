# xcodegen project definition — regenerate the project with `xcodegen generate`.
# The .xcodeproj is NOT checked in; this file is the source of truth.
name: Jot
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

packages:
  JotCore:
    path: JotCore

targets:
  Jot:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_NAME: "Voice IQ"
        PRODUCT_BUNDLE_IDENTIFIER: io.blue.voiceiq
        DEVELOPMENT_TEAM: G8K3545FJ2
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/Jot.entitlements
        ENABLE_HARDENED_RUNTIME: NO # enabled for notarized release builds (M8)
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      configs:
        # A clean clone must build with no Apple account at all — ./scripts/build.sh
        # is the README's first command and used to fail for everyone not on the
        # team above with "No signing certificate found". Manual + "-" makes Debug
        # sign ad-hoc, which never consults DEVELOPMENT_TEAM or a provisioning
        # profile, so the team stays hardcoded and only Release depends on it.
        # Ad-hoc still honours the entitlements file, so the mic prompt behaves.
        # To build under your own team: ./scripts/build.sh DEVELOPMENT_TEAM=XXXXXXXXXX
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Manual
          CODE_SIGNING_REQUIRED: NO
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    sources:
      - path: App/Sources
      - path: App/Resources/VoiceIQ.icns
      - path: App/Resources/MenuBarIcon.png
      - path: App/Resources/MenuBarIcon@2x.png
      - path: App/Resources/SidebarLogo.png
      - path: App/Resources/SidebarLogo@2x.png
      - path: App/Resources/SidebarLogoDark.png
      - path: App/Resources/SidebarLogoDark@2x.png
      # Folder references (blue folders) so bundle subdirectory structure is preserved:
      # Contents/Resources/Fonts/GoogleSansFlex/… etc.
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: App/Resources/Sounds
        type: folder
        buildPhase: resources
    dependencies:
      - package: JotCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Voice IQ
        CFBundleName: Voice IQ
        CFBundleIconFile: VoiceIQ
        # Without these the generated plist keeps xcodegen's default 1.0, so the
        # About panel and the DMG filename disagree about the version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true # menu bar app: no Dock icon
        NSMicrophoneUsageDescription: Voice IQ records audio while you hold the dictation key, so it can transcribe what you say.
        NSAudioCaptureUsageDescription: Voice IQ records the other side of your calls, so meeting notes include what everyone said.
        NSHumanReadableCopyright: "Copyright 2026 Google LLC. Apache License 2.0. This is not an officially supported Google product."
        LSMinimumSystemVersion: "14.0"
        CFBundleURLTypes:
          - CFBundleURLName: io.blue.voiceiq.url
            CFBundleURLSchemes: [voiceiq]
    scheme:
      testTargets: []
      gatherCoverageData: false
