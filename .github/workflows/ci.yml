name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: VoiceIQCore tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run package tests
        run: swift test --package-path VoiceIQCore

  app-build:
    name: App build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project VoiceIQ.xcodeproj \
            -scheme VoiceIQ \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            | tail -20

  ios-build:
    name: iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app, keyboard and Live Activity (Simulator, unsigned)
        run: |
          xcodebuild build \
            -project VoiceIQ.xcodeproj \
            -scheme VoiceIQiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            | tail -20
