name: Release

# Releases the Mac and iPhone apps together when a push to main changes
# MARKETING_VERSION in project.yml (scripts/ci-plan-release.sh):
#
#   plan ─▶ notes ─┬▶ ios   (archive, TestFlight upload, What to Test)
#                  └▶ macos (build, notarize, DMG and ZIP) ─┐
#                                                           ▼
#                     publish (GitHub release v<version>, Sparkle appcast, tag)
#
# The GitHub release and its tag are created only after both apps are built,
# so the two never ship different versions. A manual run defaults to a dry run
# that builds and checks everything and publishes nothing. docs/UPDATES.md.
on:
  push:
    branches: [main]
    paths: [project.yml]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify only; upload and publish nothing
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_BYPASS_KEYCHAIN: "1"
  ASC_TELEMETRY_DISABLED: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: scripts/ci-plan-release.sh >> "$GITHUB_OUTPUT"

  notes:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write release notes with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/generate-release-notes.py build/release-notes
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: build/release-notes

  ios:
    needs: [plan, notes]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: build/release-notes
      - name: Install tools
        run: brew install xcodegen asc
      - name: App Store Connect key
        env:
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_PRIVATE_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Signing identity and profiles
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_B64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: >
          scripts/ci-import-signing.sh
          "VoiceiQ iOS App Store" "VoiceiQ Keyboard App Store" "VoiceiQ Live Activity App Store"
      - name: Archive and upload to TestFlight
        env:
          UPLOAD: ${{ env.DRY_RUN && 'none' || 'asc' }}
          TEST_NOTES_FILE: build/release-notes/ios.txt
          SKIP_TESTS: "1" # the macos job runs them
        run: scripts/release-ios.sh

  macos:
    needs: [plan, notes]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen asc
      - name: App Store Connect key
        env:
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_PRIVATE_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Signing identity and profile
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_B64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: scripts/ci-import-signing.sh "VoiceiQ macOS Developer ID"
      - name: Test, build, notarize, package
        run: scripts/release.sh
      # tar keeps the framework symlinks and signatures that artifacts would drop.
      - name: Pack
        run: >
          tar -czf "$RUNNER_TEMP/mac-release.tgz"
          build/release/VoiceiQ-*.zip build/release/VoiceiQ-*.dmg
          build/release/DerivedData/Build/Products/Release/VoiceiQ.app
          build/release/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: ${{ runner.temp }}/mac-release.tgz
          compression-level: 0

  publish:
    needs: [plan, notes, ios, macos]
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Unpack
        run: |
          tar -xzf "$RUNNER_TEMP/artifacts/mac-release/mac-release.tgz"
          mkdir -p build/release-notes
          cp "$RUNNER_TEMP"/artifacts/release-notes/* build/release-notes/
      - name: Publish GitHub release and appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          RELEASE_NOTES: build/release-notes/github.md
          SPARKLE_NOTES: build/release-notes/mac.md
        run: |
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          SPARKLE_ED_KEY_FILE="$RUNNER_TEMP/sparkle.key" scripts/publish-github-release.sh
      - name: Summary
        if: always()
        run: |
          {
            echo "## VoiceiQ ${{ needs.plan.outputs.version }} (${{ needs.plan.outputs.build }})${DRY_RUN:+ — dry run}"
            cat build/release-notes/github.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
